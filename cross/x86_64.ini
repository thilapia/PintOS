[binaries]
c = ['clang', '--target=x86_64-unknown-none-elf']
nasm = 'nasm'
ar = 'llvm-ar'
strip = 'llvm-strip'
ld = 'ld.lld'

[host_machine]
system = 'none'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[properties]
needs_exe_wrapper = true

[built-in options]
c_std = 'c23'
default_library = 'static'
b_pie = false
b_lto = false
